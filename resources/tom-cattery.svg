<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cat ears -->
  <polygon points="4,2 2,8 6,8" fill="currentColor" stroke="currentColor"/>
  <polygon points="20,2 18,8 22,8" fill="currentColor" stroke="currentColor"/>
  <!-- Cat head -->
  <circle cx="12" cy="11" r="7"/>
  <!-- Eyes -->
  <circle cx="9.5" cy="10" r="1" fill="currentColor"/>
  <circle cx="14.5" cy="10" r="1" fill="currentColor"/>
  <!-- Nose -->
  <polygon points="12,12.5 11,13.5 13,13.5" fill="currentColor"/>
  <!-- Mouth -->
  <path d="M10,14.5 Q12,16 14,14.5"/>
  <!-- Whiskers -->
  <line x1="3" y1="12" x2="7" y2="11.5"/>
  <line x1="3" y1="13.5" x2="7" y2="13"/>
  <line x1="17" y1="11.5" x2="21" y2="12"/>
  <line x1="17" y1="13" x2="21" y2="13.5"/>
</svg>
